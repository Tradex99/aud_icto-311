name: audius

on:
  repository_dispatch:
    types: [run-sporty]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: audius-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 358

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---------------------------------------------------------------
      # Chromium + its OS libraries (cannot live in requirements.txt)
      # ---------------------------------------------------------------
      - name: Install Playwright Chromium (with OS deps)
        run: |
          python -m playwright install --with-deps chromium

      # ---------------------------------------------------------------
      # Xvfb — required because login.py launches headless=False
      # ---------------------------------------------------------------
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run login.py under Xvfb
        env:
          PYTHONUNBUFFERED: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          timeout 355m xvfb-run -a --server-args="-screen 0 1280x720x24" \
            python3 -u src/signup.py || true

      - name: Trigger the next run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/dispatches" \
            -d '{"event_type":"run-sporty"}'
